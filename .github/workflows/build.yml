name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (sin la v, ej. 0.1.8). Si se indica, crea el tag y el release.'
        required: false
        default: ''

permissions:
  contents: write   # necesario para crear releases en tags
  actions: read     # SignPath baja el artefacto sin firmar de la corrida

jobs:
  # Compilación rápida en cada push/PR para detectar que rompe
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/EasyRest.Avalonia/EasyRest.Avalonia.csproj -c Release
      - run: dotnet test tests/EasyRest.Sync.Server.Tests/EasyRest.Sync.Server.Tests.csproj
      # el instalador se prueba contra un prefijo temporal: no necesita systemd ni root
      - run: bash tests/install/test-install.sh

  # Spike de Android. Va en su propio job porque necesita el workload, que tarda en instalarse.
  # Además de decir si el head compila, deja el APK como artefacto de la corrida: el SDK de
  # Android sólo está acá, así que este es el lugar donde se puede armar.
  android-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet workload install android

      # publish y no build -t:SignAndroidPackage: ese target arma un APK igual, pero en Release
      # el paso que genera los stubs de Java sale con las manos vacías y el APK queda sin la
      # actividad de lanzador. publish es el camino soportado para un APK de Release.
      #
      # Release y no Debug: en Debug, .NET Android usa fast deployment y deja los assemblies
      # fuera del APK, así que un APK instalado a mano no arranca. Igual va firmado con el
      # keystore de depuración —sin keystore propio se usa ese—, así que se instala con
      # "orígenes desconocidos" y listo. Lo del linker y el AOT está en el csproj.
      - name: Armar el APK
        run: |
          dotnet publish src/EasyRest.Android/EasyRest.Android.csproj \
            -c Release -o apk -v:normal 2>&1 | tee build.log
          ls -la apk/*-Signed.apk

      # TEMPORAL — mientras el APK salga sin actividades. Corre igual si el build falla.
      - name: Diagnóstico de los stubs de Java
        if: always()
        run: |
          echo "--- .java generados (los ACW):"
          find src/EasyRest.Android/obj -name '*.java' | sed 's|.*/android/src/||' | sort | head -40
          echo "--- manifiesto generado:"
          find src/EasyRest.Android/obj -path '*android/manifest/AndroidManifest.xml' \
            -exec cat {} \;
          echo "--- lo que dijo el build sobre stubs y assemblies:"
          grep -inE "javastub|acw|typemap|MainActivity|ProbeActivity" build.log | head -40 || true

      # Sin esto la app instala, no aparece en el cajón y el log del build no muestra nada raro:
      # el chequeo tiene que fallar de verdad, no imprimir y seguir.
      - name: Verificar que tenga lanzador e ícono
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          "$AAPT" dump badging apk/*-Signed.apk > badging.txt
          echo "--- resumen del APK:"
          grep -E "^package:|^application:|^launchable-activity:" badging.txt || true

          grep -q "^launchable-activity:" badging.txt || {
            echo "::error::el APK no declara ninguna actividad de lanzador"; exit 1; }
          grep -qE "^application:.*icon='[^']+'" badging.txt || {
            echo "::error::el APK no declara ícono de aplicación"; exit 1; }

          # Cada corrida firma con un keystore de depuración distinto (se genera por máquina y
          # los runners son efímeros), así que instalar encima de un APK de otra corrida falla
          # con "aplicación no instalada".
          echo "::notice::Si ya tenías instalada otra versión, desinstalala primero: adb uninstall com.rentlysoft.easyrest"

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyRest-android-spike-apk
          path: apk/*-Signed.apk
          if-no-files-found: error

  # El Core compilado sin JIT ni Reflection.Emit, que es la restricción de iOS. Verifica que el
  # motor de scripts y el resto del Core sigan funcionando ahí: si esto se rompe, el móvil deja
  # de ser viable y conviene enterarse en el PR y no en el teléfono.
  aot-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish tests/aot-probe/AotProbe.csproj -c Release -r linux-x64 -o aot
      - run: ./aot/AotProbe

  # Tarballs del servidor de sync para instalar sin Docker. Los consume install.sh, que baja el
  # .tar.gz y verifica el .sha256 antes de tocar nada.
  publish-server:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolver versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="${{ inputs.version }}"; fi
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish del server (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish src/EasyRest.Sync.Server/EasyRest.Sync.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" \
            -o publish/server-${{ matrix.rid }}

      - name: Empaquetar y firmar con sha256
        shell: bash
        run: |
          mkdir -p stage-server
          cp -R "publish/server-${{ matrix.rid }}" stage-server/easyrest-sync
          chmod +x stage-server/easyrest-sync/EasyRest.Sync.Server
          tar -czf "easyrest-sync-${{ matrix.rid }}.tar.gz" -C stage-server easyrest-sync
          sha256sum "easyrest-sync-${{ matrix.rid }}.tar.gz" \
            | cut -d' ' -f1 > "easyrest-sync-${{ matrix.rid }}.tar.gz.sha256"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: easyrest-sync-${{ matrix.rid }}
          path: |
            easyrest-sync-${{ matrix.rid }}.tar.gz
            easyrest-sync-${{ matrix.rid }}.tar.gz.sha256
          if-no-files-found: error

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            easyrest-sync-${{ matrix.rid }}.tar.gz
            easyrest-sync-${{ matrix.rid }}.tar.gz.sha256

      # el instalador va una sola vez, no una por arquitectura: es el mismo script y la URL
      # .../releases/latest/download/install.sh tiene que resolver a algo
      - name: Adjuntar install.sh al release
        if: matrix.rid == 'linux-x64' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != ''))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: install/install.sh

  # Binarios por plataforma. Corre en tags v* o a mano (workflow_dispatch).
  #
  # Firma: los pasos de firma se prenden solos cuando están cargados los secrets
  # (MACOS_CERT_P12 para Apple, SIGNPATH_API_TOKEN para Windows). Sin ellos el workflow
  # sigue funcionando y publica sin firmar, como antes. Ver docs/FIRMA.md.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  rid: win-x64,     name: windows-x64 }
          - { os: macos-latest,    rid: osx-arm64,   name: macos-arm64 }
          # macos-13 se retiró en diciembre de 2025 (por eso la v0.1.10 salió sin binario
          # de Intel). macos-15-intel es el reemplazo x86_64, disponible hasta 2027.
          - { os: macos-15-intel,  rid: osx-x64,     name: macos-x64 }
          # linux-arm64 se cruza desde x64 sin emular: el publish autocontenido no compila
          # nada nativo, sólo copia el runtime del RID que se le pida
          - { os: ubuntu-latest,   rid: linux-x64,   name: linux-x64 }
          - { os: ubuntu-latest,   rid: linux-arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # los secrets no se pueden usar en el `if:` de un step: se pasan por env y se chequea env
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # En tags v* la versión sale del tag (la muestra la pantalla "Acerca de");
      # en dispatch manual, del input.
      - name: Resolver versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="${{ inputs.version }}"; fi
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      # Autocontenido, en carpeta (no single-file): el bundle single-file se auto-extrae en
      # %TEMP% al arrancar y eso es justo lo que marcan los antivirus y SmartScreen.
      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish src/EasyRest.Avalonia/EasyRest.Avalonia.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" \
            -o publish/${{ matrix.name }}

      # ---------- Windows ----------

      # Se firma sólo el apphost (EasyRest.exe): es el que abre el usuario y el que miran
      # SmartScreen y los antivirus. Sube el exe como artefacto, SignPath lo firma y lo
      # devuelve en signed-exe/.
      - name: Subir EasyRest.exe sin firmar (SignPath)
        id: upload-unsigned-exe
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-EasyRest-exe
          path: publish/${{ matrix.name }}/EasyRest.exe
          if-no-files-found: error

      - name: Firmar EasyRest.exe (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'easyrest' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG_SLUG || 'exe' }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Usar el exe firmado
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: cp signed-exe/EasyRest.exe "publish/${{ matrix.name }}/EasyRest.exe"

      # Zip portable: adentro va la carpeta `EasyRest/`, no archivos sueltos.
      # Es el asset que consume el auto update.
      - name: Empaquetar portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp -R "publish/${{ matrix.name }}" stage/EasyRest
          7z a "EasyRest-win-x64-portable.zip" "./stage/EasyRest" >/dev/null

      # Installer: instala en %LocalAppData%\Programs\EasyRest (sin UAC, y con permisos para
      # que el auto update pueda reemplazar la carpeta). Inno Setup ya no viene en la imagen
      # de windows-latest (Server 2025), así que se instala con choco.
      - name: Instalar Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Armar installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$VERSION" \
            '/DPayloadDir=..\publish\${{ matrix.name }}' \
            build/easyrest.iss
          ls -la dist/

      - name: Subir installer sin firmar (SignPath)
        id: upload-unsigned-setup
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-EasyRest-Setup
          path: dist/EasyRest-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Firmar installer (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'easyrest' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Usar el installer firmado
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: cp "signed-setup/EasyRest-Setup-$VERSION.exe" "dist/EasyRest-Setup-$VERSION.exe"

      # ---------- macOS ----------

      - name: Armar EasyRest.app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="EasyRest.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "publish/${{ matrix.name }}/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/EasyRest"
          sed "s/__VERSION__/${VERSION}/g" build/Info.plist > "$APP/Contents/Info.plist"
          # icono: armar el .icns desde build/icon.png (1024px)
          ICONSET="EasyRest.iconset"; mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s build/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d build/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/EasyRest.icns"

      # Developer ID + notarización: es lo único que hace que Gatekeeper abra la app sin
      # ningún cartel. Se firma de adentro hacia afuera (--deep está deprecado por Apple).
      - name: Firmar y notarizar (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          APP="EasyRest.app"

          # 1. certificado en un keychain temporal de la corrida
          KEYCHAIN="$RUNNER_TEMP/easyrest-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # sin esto codesign pide el password por diálogo y el job se cuelga
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::El .p12 no trae un certificado 'Developer ID Application'."
            exit 1
          fi
          echo "Firmando con: $IDENTITY"

          # 2. los xattr que quedan al copiar rompen codesign ("resource fork")
          xattr -cr "$APP"

          # 3. firmar todos los Mach-O internos (dylibs de Skia/HarfBuzz, createdump, etc.)
          #    y después el bundle. Los internos no llevan entitlements: van sólo en el main.
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN" --sign "$IDENTITY" "$f"
            fi
          done < <(find "$APP/Contents/MacOS" -type f -print0)

          codesign --force --options runtime --timestamp \
            --entitlements build/EasyRest.entitlements \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # 4. notarizar: Apple revisa el zip y emite un ticket
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          # 5. pegar el ticket al bundle: así abre sin consultar a Apple (y sin internet)
          xcrun stapler staple "$APP"
          # verificación final: esto es lo que evalúa Gatekeeper al abrirla
          spctl -a -vvv -t exec "$APP"

      - name: Firma ad-hoc (macOS sin certificado)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 == ''
        shell: bash
        run: |
          # sin cuenta de Apple: en Apple Silicon un binario sin ninguna firma lo mata el SO.
          # No sirve para Gatekeeper (el usuario la tiene que autorizar a mano la primera vez).
          codesign --force --deep --sign - EasyRest.app
          echo "::warning::EasyRest.app quedó con firma ad-hoc: Gatekeeper la va a bloquear la primera vez."

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # ditto preserva el bundle, los permisos, la firma y el ticket de notarización
        # (un zip común los pierde)
        run: ditto -c -k --keepParent EasyRest.app "EasyRest-${{ matrix.name }}.zip"

      # ---------- Linux ----------

      # tar.gz y no zip: es la convención en Linux y lleva permisos y symlinks de forma portable
      # entre cualquier herramienta que use la gente para desempaquetarlo
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage
          cp -R "publish/${{ matrix.name }}" stage/EasyRest
          chmod +x stage/EasyRest/EasyRest
          tar -czf "EasyRest-${{ matrix.name }}.tar.gz" -C stage EasyRest

      # ---------- Artefactos y release ----------

      - name: Listar assets de esta plataforma
        shell: bash
        run: |
          {
            echo 'ASSETS<<EOF'
            case "${{ runner.os }}" in
              Windows)
                echo "dist/EasyRest-Setup-$VERSION.exe"
                echo "EasyRest-win-x64-portable.zip"
                ;;
              Linux)
                echo "EasyRest-${{ matrix.name }}.tar.gz"
                ;;
              *)
                echo "EasyRest-${{ matrix.name }}.zip"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: EasyRest-${{ matrix.name }}
          path: ${{ env.ASSETS }}
          if-no-files-found: error

      # En tags adjunta al release del tag. En dispatch manual con version, crea el tag
      # v<version> (sobre el head de la rama default) y el release, y adjunta ahí.
      - name: Adjuntar al release (tags, o dispatch con versión)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: ${{ env.ASSETS }}
